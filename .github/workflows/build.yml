name: Build TranscribeApp

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: TranscribeApp-windows
          - os: macos-latest
            artifact_name: TranscribeApp-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build
        run: python build.py

      - name: Zip build (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/TranscribeApp -DestinationPath TranscribeApp-windows.zip
        shell: pwsh

      - name: Zip build (macOS)
        if: runner.os == 'macOS'
        run: cd dist && zip -r ../TranscribeApp-macos.zip TranscribeApp.app

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: TranscribeApp-*.zip

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: TranscribeApp-*.zip
          fail_on_unmatched_files: true
          body: |
            ## הורדה
            הורידו את קובץ ה-zip למערכת ההפעלה שלכם, חלצו, והריצו את `TranscribeApp.exe` (Windows) או `TranscribeApp.app` (macOS). לא נדרשת התקנה.

            ## ⚠️ אזהרה בהרצה ראשונה (צפוי, לא באג)
            הקובץ לא חתום דיגיטלית (חתימת קוד עולה כסף), אז במערכת ההפעלה עלולה להופיע אזהרה:

            - **Windows:** לחיצה ימנית על קובץ ה-zip → **Properties** → סמנו **Unblock** → **OK**, ואז חלצו. אם עדיין מופיע מסך "Windows protected your PC" → **More info** → **Run anyway**.
            - **macOS:** System Settings → Privacy & Security → אשרו את הפתיחה שם אם היא נחסמה.

            צריך מפתח API משלכם מ-[platform.openai.com](https://platform.openai.com/api-keys) — מוזן פעם אחת במסך ההגדרות בתוכנה.
